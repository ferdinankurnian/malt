[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "malt"
version = "0.1.0"
description = "Manage multiple project MCP servers from one dashboard"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "mcp[cli]>=1.28",
    "PyGObject>=3.50",
    "starlette",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
]

[project.scripts]
malt = "malt.main:main"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=8.0",
    "ruff>=0.15.22",
]

[tool.hatch.build.targets.wheel]
packages = ["malt"]

[tool.hatch.build.targets.wheel.force-include]
"malt/ui/style.css" = "malt/ui/style.css"
"assets/" = "malt/assets/"

[tool.mypy]
ignore_missing_imports = true
