name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - name: Install Python dependencies
        run: pip install uv && uv sync --group dev
      - name: Release gate
        run: |
          uv run ruff check malt/
          uv run mypy malt/
          uv run pytest tests/
